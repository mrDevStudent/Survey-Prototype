<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-2:#EFEADC;
    --ink:#242A25;
    --ink-soft:#5E6459;
    --teal:#1E9188;
    --teal-dark:#0E5B54;
    --amber:#E2A33B;
    --coral:#F2683F;
    --violet:#8B67D6;
    --line:#E3DDC8;
    --error:#D1453A;
    --good:#2E9E52;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:11px;
    --shadow-pop: 0 4px 0 rgba(14,91,84,0.9), 0 10px 22px rgba(35,39,34,0.10);
    --card-shadow: 0 2px 0 rgba(35,39,34,0.05), 0 14px 30px -18px rgba(35,39,34,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 4%, rgba(30,145,136,0.07), transparent 40%),
      radial-gradient(circle at 96% 92%, rgba(242,104,63,0.06), transparent 42%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .app{
    max-width:760px;
    margin:0 auto;
    padding:56px 32px 96px;
    position:relative;
    transition:max-width 0.15s ease;
  }
  .app.app-wide{
    max-width:1080px;
  }
  @media (max-width:640px){
    .app{ padding:24px 16px 64px; }
  }
  @media (max-width:380px){
    .app{ padding:20px 12px 56px; }
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--teal-dark);
    background:#fff;
    border:1.5px solid var(--line);
    padding:6px 13px 6px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:"";
    width:8px; height:8px;
    border-radius:50%;
    background:var(--coral);
    box-shadow:0 0 0 3px rgba(242,104,63,0.18);
    flex-shrink:0;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,38px);
    line-height:1.15;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:21px;
    margin:0 0 4px;
  }
  h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:17px;
    margin:0 0 6px;
  }
  p.lede{
    color:var(--ink-soft);
    font-size:15.5px;
    line-height:1.6;
    max-width:60ch;
  }
  .card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--card-shadow);
    padding:32px;
    margin-top:24px;
  }
  @media (max-width:640px){
    .card{ padding:20px 16px; margin-top:18px; border-radius:var(--radius-md); }
  }
  .hr{
    border:none;
    border-top:1.5px dashed var(--line);
    margin:20px 0;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:13px 26px;
    border-radius:999px;
    border:1.5px solid var(--teal-dark);
    background:var(--teal);
    color:#fff;
    cursor:pointer;
    box-shadow:var(--shadow-pop);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:hover{background:var(--teal-dark); transform:translateY(-1px);}
  .btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 rgba(14,91,84,0.9), 0 4px 10px rgba(35,39,34,0.12);
  }
  .btn.secondary{
    background:#fff;
    color:var(--ink);
    border:1.5px solid var(--line);
    box-shadow:0 4px 0 var(--line), 0 10px 22px rgba(35,39,34,0.06);
  }
  .btn.secondary:hover{border-color:var(--ink-soft); background:var(--paper-2);}
  .btn.secondary:active{ box-shadow:0 1px 0 var(--line); }
  .btn.danger{
    background:#fff;
    color:var(--error);
    border:1.5px solid var(--error);
    box-shadow:0 4px 0 rgba(209,69,58,0.35), 0 10px 22px rgba(35,39,34,0.06);
  }
  .btn-disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .btn-disabled:hover{ background:var(--teal); transform:none; }
  .hub-progress{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:10px;
    text-align:right;
  }
  .btn-row{
    display:flex;
    justify-content:space-between;
    margin-top:32px;
    gap:12px;
  }
  .btn-row.end{justify-content:flex-end;}
  @media (max-width:560px){
    .btn-row{ flex-direction:column-reverse; }
    .btn-row.end{ flex-direction:row; }
    .btn-row > div{ display:flex; gap:12px; width:100%; }
    .btn-row > div .btn{ flex:1; }
    .btn{ width:100%; text-align:center; padding:14px 20px; }
    .btn-row.end .btn{ width:auto; }
  }
  label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--ink);
  }
  label .opt{
    font-weight:400;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
  }
  input[type=text],input[type=number],input[type=email],select{
    width:100%;
    padding:11px 14px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    background:var(--paper);
    color:var(--ink);
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  input:focus,select:focus,button:focus-visible{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 4px rgba(30,145,136,0.15);
  }
  .field{margin-bottom:18px;}
  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:560px){ .grid-2{grid-template-columns:1fr;} }

  .cat-list{ margin-top:2px; }
  .cat-row{
    display:flex; align-items:center; gap:18px;
    padding:20px 2px;
    border-bottom:1.5px dashed var(--line);
    cursor:pointer;
    background:transparent;
    transition:padding-left .15s ease, background .15s ease;
  }
  .cat-row:last-of-type{ border-bottom:none; }
  .cat-row:hover{
    padding-left:10px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--cat-color, var(--teal)) 7%, transparent), transparent 70%);
  }
  .cat-pick-body{ flex:1; min-width:0; }
  .cat-status{ flex-shrink:0; text-align:right; margin-left:8px; }
  .cat-status .frac{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-stamp{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--good);
    border:1.5px solid var(--good);
    border-radius:5px;
    padding:3px 7px;
    transform:rotate(-4deg);
    white-space:nowrap;
  }
  @media (max-width:480px){
    .cat-row{ gap:12px; align-items:flex-start; }
  }
  .cat-code{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--cat-color, var(--amber)); letter-spacing:0.06em; font-weight:600;
    background:color-mix(in srgb, var(--cat-color, var(--amber)) 12%, #fff);
    padding:2px 8px; border-radius:999px;
  }
  .cat-title{ display:block; font-family:'Fraunces',serif; font-size:17px; margin-top:6px; }
  .cat-sub{ display:block; color:var(--ink-soft); font-size:13.5px; margin-top:2px; }

  .q-block{
    padding:22px 0;
    border-bottom:1.5px dashed var(--line);
  }
  .q-block:last-child{border-bottom:none;}
  .q-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:#fff;
    background:var(--amber);
    letter-spacing:0.06em;
    margin-bottom:12px;
    padding:4px 10px;
    border-radius:999px;
    display:inline-block;
  }
  .q-scenario{
    font-size:15px;
    line-height:1.55;
    margin-bottom:8px;
  }
  .q-prompt{
    font-size:13.5px;
    font-weight:600;
    color:var(--teal-dark);
    margin-bottom:12px;
  }
  .opt-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-md);
    margin-bottom:9px;
    cursor:pointer;
    transition:transform .1s ease, border-color .12s ease, background .12s ease;
    font-size:14px;
    line-height:1.5;
    background:#fff;
  }
  .opt-row:hover{border-color:var(--teal); transform:translateX(2px);}
  .opt-row input{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .opt-row:focus-within{
    border-color:var(--teal);
    box-shadow:0 0 0 4px rgba(30,145,136,0.15);
  }
  .opt-row.checked{
    border-color:var(--teal-dark);
    background:#F1F8F6;
    box-shadow:0 3px 0 rgba(14,91,84,0.12);
  }
  .opt-letter{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    color:var(--teal-dark);
    background:transparent;
    border:1.5px solid var(--line);
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px; height:20px;
    border-radius:50%;
    font-size:11.5px;
    margin-right:2px;
    transition:background .12s ease, color .12s ease, border-color .12s ease, transform .12s ease;
  }
  .opt-row.checked .opt-letter{
    color:#fff;
    background:var(--teal-dark);
    border-color:var(--teal-dark);
    transform:scale(1.1);
  }
  .error-msg{
    color:var(--error);
    font-size:13px;
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
  }
  .consent-box{
    background:var(--paper);
    border:1.5px dashed var(--line);
    border-radius:var(--radius-md);
    padding:20px;
    max-height:260px;
    overflow-y:auto;
    font-size:14px;
    line-height:1.7;
    color:var(--ink-soft);
    margin:20px 0;
  }
  .consent-box strong{color:var(--ink);}
  .check-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-top:16px;
  }
  .check-row input{margin-top:3px; accent-color:var(--teal-dark); width:16px; height:16px;}
  .check-row label{font-weight:500;font-size:14px;margin:0;}
  .review-cat{ margin-bottom:14px; }
  .review-cat h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 4px;
  }
  .review-cat p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .stamp{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.06em;
    color:#fff;
    background:var(--good);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:16px;
    animation: popIn 0.35s ease;
  }
  @keyframes popIn{
    0%{ transform:scale(0.6); opacity:0; }
    70%{ transform:scale(1.06); opacity:1; }
    100%{ transform:scale(1); }
  }
  .score-panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin:20px 0;
  }
  @media (max-width:560px){ .score-panel{grid-template-columns:1fr;} }
  .score-card{
    border:1.5px solid var(--line);
    border-radius:var(--radius-md);
    padding:22px;
    text-align:center;
    background:linear-gradient(180deg, #fff, var(--paper-2) 260%);
  }
  .score-card .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .score-card .value{
    font-family:'Fraunces',serif;
    font-size:42px;
    font-weight:600;
    color:var(--teal-dark);
    margin:8px 0 2px;
  }
  .score-card .sub{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .delta-good{color:var(--good); font-weight:600;}
  .delta-bad{color:var(--error); font-weight:600;}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
  }
  th,td{
    text-align:left;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  th{
    color:var(--ink-soft);
    font-weight:500;
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:0.06em;
  }
  .table-wrap{
    overflow-x:auto;
    border:1.5px solid var(--line);
    border-radius:var(--radius-md);
    margin-top:20px;
  }
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
  }
  .card-narrow{ max-width:360px; margin-left:auto; margin-right:auto; }
  .pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    background:var(--paper-2);
    padding:5px 12px;
    border-radius:999px;
    color:var(--ink-soft);
  }
  a.quiet{color:var(--teal-dark);font-size:13px;}
  .ai-box{
    margin-top:18px;
    padding:16px;
    border:1.5px dashed var(--teal);
    border-radius:var(--radius-md);
    background:var(--paper-2);
  }
  .ai-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  @keyframes aiPop{
    0%{ transform:scale(0.5) rotate(-6deg); opacity:0; }
    70%{ transform:scale(1.08) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); }
  }
  @keyframes aiBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-2px) rotate(-3deg); }
  }
  .ai-mascot{
    width:36px;
    height:36px;
    flex-shrink:0;
    animation: aiPop 0.4s ease, aiBob 2.6s ease-in-out 0.4s infinite;
  }
  .ai-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--teal-dark);
    font-weight:600;
  }
  .ai-text{
    font-size:14px;
    line-height:1.65;
    color:var(--ink);
  }
  .ai-loading{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .ai-error{
    font-size:13px;
    color:var(--error);
  }
  .review-answer{
    margin:10px 0 0;
    font-size:14px;
    color:var(--ink-soft);
  }
  .review-answer strong{ color:var(--ink); }

  .cat-academic{ --cat-color: var(--teal); }
  .cat-emotional{ --cat-color: var(--violet); }
  .cat-social{ --cat-color: var(--coral); }
  .cat-family{ --cat-color: var(--amber); }
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAE6qiggxn3lnUFYPOCY2sSl4mbyHswvRA",
    authDomain: "student-survey-db.firebaseapp.com",
    projectId: "student-survey-db",
    storageBucket: "student-survey-db.firebasestorage.app",
    messagingSenderId: "661164339094",
    appId: "1:661164339094:web:a797cf05581ba6af2837b7"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);
  const RESPONSES_COL = 'responses';
  const BACKUP_COL = 'responses_backup';

  // Exposed on window so the classic <script> below (which uses plain
  // top-level functions + inline onclick=) can call into Firestore.
  window.__fb = {
    async addResponse(entry){
      const ref = await addDoc(collection(db, RESPONSES_COL), entry);
      return ref.id;
    },
    async getResponses(){
      const snap = await getDocs(collection(db, RESPONSES_COL));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async getArchived(){
      const snap = await getDocs(collection(db, BACKUP_COL));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    // Soft-delete: copies each doc into responses_backup (same doc id,
    // plus an archivedAt timestamp) then removes it from responses.
    // Nothing is ever permanently destroyed from the admin UI.
    async archiveResponses(ids){
      for (const id of ids){
        const srcRef = doc(db, RESPONSES_COL, id);
        const snap = await getDoc(srcRef);
        if (snap.exists()){
          await setDoc(doc(db, BACKUP_COL, id), { ...snap.data(), archivedAt: new Date().toISOString() });
          await deleteDoc(srcRef);
        }
      }
    },
    // Reverses archiveResponses: copies the doc back into responses
    // (dropping the archivedAt marker) and removes it from the backup.
    async restoreResponses(ids){
      for (const id of ids){
        const srcRef = doc(db, BACKUP_COL, id);
        const snap = await getDoc(srcRef);
        if (snap.exists()){
          const data = snap.data();
          delete data.archivedAt;
          await setDoc(doc(db, RESPONSES_COL, id), data);
          await deleteDoc(srcRef);
        }
      }
    }
  };
</script>

  if (!res.ok){
    let detail = '';
    try { detail = (await res.json())?.error?.message || ''; } catch(e){}
    throw new Error(`Gemini API error (${res.status})${detail ? ': ' + detail : ''}`);
  }
  const data = await res.json();
  const text = (data?.candidates?.[0]?.content?.parts || []).map(p=>p.text||'').join('').trim();
  if (!text) throw new Error('Gemini returned an empty response.');
  return text;
}

function renderAIBox(qk){
  const rec = state.data.explanations[qk];
  const header = `<div class="ai-header">${aiMascotSVG()}<span class="ai-label">AI Explanation</span></div>`;
  if (!rec || rec.status === 'idle'){
    return `<div class="ai-box">${header}<button class="btn secondary ai-retry-btn" data-qk="${qk}">Generate explanation</button></div>`;
  }
  if (rec.status === 'loading'){

  }
  if (rec.status === 'error'){
    return `<div class="ai-box">

      <button class="btn secondary ai-retry-btn" data-qk="${qk}" style="margin-top:10px;">Try again</button>
    </div>`;
  }
  return `<div class="ai-box">${header}<div class="ai-text">${esc(rec.text)}</div></div>`;
}

function questionsFor(section, catKey){
  return QUESTION_BANK
    .filter(q => q.section === section && q.category === catKey)
    .sort((a,b) => a.num - b.num);
}

function allQuestionsFor(section){
  return QUESTION_BANK.filter(q => q.section === section).sort((a,b)=>{
    const ci = CATEGORIES.findIndex(c=>c.key===a.category) - CATEGORIES.findIndex(c=>c.key===b.category);
    return ci !== 0 ? ci : a.num - b.num;
  });
}

const DB = {
  async all(){ return await window.__fb.getResponses(); },
  async archived(){ return await window.__fb.getArchived(); },
  async add(entry){
    const id = await window.__fb.addResponse(entry);
    entry.id = id;
    return entry;
  },
  async archive(ids){ await window.__fb.archiveResponses(ids); },
  async restore(ids){ await window.__fb.restoreResponses(ids); }
};

const DRAFT_KEY = 'sim_draft_v2';
function saveDraft(){ localStorage.setItem(DRAFT_KEY, JSON.stringify(state.data)); }
function loadDraft(){ const d = localStorage.getItem(DRAFT_KEY); return d ? JSON.parse(d) : null; }
function clearDraft(){ localStorage.removeItem(DRAFT_KEY); }

function blankData(){
  return { demo:{}, preAnswers:{}, postAnswers:{}, explanations:{}, recorded:false, recording:false };
}

const state = {
  route: location.hash.replace('#','') || 'landing',
  data: loadDraft() || blankData(),
  adminAuthed: sessionStorage.getItem('admin_authed') === '1',
};
if (!state.data.explanations) state.data.explanations = state.data.postExplanations || {};
delete state.data.postExplanations;

window.addEventListener('hashchange', ()=>{ state.route = location.hash.replace('#','') || 'landing'; render(); });

function go(route){ location.hash = route; }

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function questionKey(section, q){ return `${section}_${q.category}_q${q.num}`; }

function categoryStatus(section, catKey){
  const qs = questionsFor(section, catKey);
  const answers = section === 'pre' ? state.data.preAnswers : state.data.postAnswers;
  const answered = qs.filter(q => answers[questionKey(section,q)]).length;
  return { answered, total: qs.length, complete: answered === qs.length };
}

function phaseComplete(section){
  return CATEGORIES.every(c => categoryStatus(section, c.key).complete);
}

  const r = state.route;
  const isAdminRoute = r === 'portal-9x7k2m-dash';

  if (r === 'landing') return go('consent');
  if (r === 'consent') return renderConsent(app);
  if (r === 'demo') return renderDemographics(app);
  if (r === 'pre-hub') return renderHub(app, 'pre');
  if (r === 'post-hub') return renderHub(app, 'post');
  if (r.startsWith('pre-review-')) return renderCategoryReview(app, 'pre', r.slice('pre-review-'.length));
  if (r.startsWith('post-review-')) return renderCategoryReview(app, 'post', r.slice('post-review-'.length));
  if (r.startsWith('pre-')) return renderQuestionnaire(app, 'pre', r.slice(4));
  if (r.startsWith('post-')) return renderQuestionnaire(app, 'post', r.slice(5));
  if (r === 'results') return renderResults(app);
  if (r === 'portal-9x7k2m') return renderAdminLogin(app);
  if (r === 'portal-9x7k2m-dash') return renderAdminDash(app);
  return go('consent');
}

function renderQuestionnaire(app, section, catKey){
  const cat = CATEGORIES.find(c=>c.key===catKey);
  if (!cat) return go(`${section}-hub`);
  if (section === 'post' && !phaseComplete('pre')) return go('pre-hub');

  const questions = questionsFor(section, cat.key);
  const answers = section === 'pre' ? state.data.preAnswers : state.data.postAnswers;
  const label = section === 'pre' ? 'Pre-test' : 'Post-test';
  const hubRoute = `${section}-hub`;

  // One question at a time within a category. state.qNav tracks which
  // question we're on; it resets whenever we land on a new category route
  // (e.g. via the hub), resuming at the first unanswered item.
  if (!state.qNav || state.qNav.section !== section || state.qNav.catKey !== catKey){
    let startIdx = questions.findIndex(q => !answers[questionKey(section,q)]);
    if (startIdx === -1) startIdx = 0;
    state.qNav = { section, catKey, index: startIdx };
  }
  let idx = Math.min(Math.max(state.qNav.index, 0), questions.length - 1);
  state.qNav.index = idx;

  const q = questions[idx];
  const qk = questionKey(section, q);
  const selected = answers[qk];
  const isLast = idx === questions.length - 1;

  app.innerHTML = `
    <div class="eyebrow">${label} — ${esc(cat.title)}</div>
    <h1>${label}: ${esc(cat.title)}</h1>
    <p class="lede">Read the scenario and choose the response you believe is most appropriate.</p>
    <div class="card">
      <div class="q-block" style="border-bottom:none; padding-top:0;">
        <span class="q-code">${cat.code} · Question ${idx+1} of ${questions.length}</span>
        <div class="q-scenario">${esc(q.scenario)}</div>
        <div class="q-prompt">${esc(q.question)}</div>
        ${['A','B','C','D'].map(letter=>{
          const text = q.options[letter];
          if (!text) return '';
          return `
          <label class="opt-row ${selected===letter?'checked':''}" data-qk="${qk}" data-letter="${letter}">
            <input type="radio" name="${qk}" value="${letter}" ${selected===letter?'checked':''}>
            <span><span class="opt-letter">${letter}.</span> ${esc(text)}</span>
          </label>`;
        }).join('')}
      </div>
      <div id="qErr"></div>
      <div class="btn-row">
        <button class="btn secondary" id="qBack">${idx === 0 ? '← Back to checklist' : '← Previous question'}</button>
        <button class="btn" id="qNext">${isLast ? 'Finish category →' : 'Next question →'}</button>
      </div>
      <p class="hub-progress">Question ${idx+1} of ${questions.length}</p>
    </div>
  `;

  document.querySelectorAll('.opt-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const letter = row.dataset.letter;
      answers[qk] = letter;
      saveDraft();
      document.querySelectorAll(`.opt-row[data-qk="${qk}"]`).forEach(r=>{
        r.classList.toggle('checked', r.dataset.letter === letter);
      });
    });
  });

  document.getElementById('qBack').onclick = ()=>{
    if (idx === 0){
      state.qNav = null;
      go(hubRoute);
    } else {
      state.qNav.index = idx - 1;
      render();
    }
  };

  document.getElementById('qNext').onclick = ()=>{
    if (!answers[qk]){
      document.getElementById('qErr').innerHTML = `<div class="error-msg">Please select an answer before continuing.</div>`;
      return;
    }
    if (isLast){
      state.qNav = null;
      go(`${section}-review-${catKey}`);
    } else {
      state.qNav.index = idx + 1;
      render();
    }
  };
}

function renderCategoryReview(app, section, catKey){
  const cat = CATEGORIES.find(c=>c.key===catKey);
  if (!cat) return go(`${section}-hub`);
  const questions = questionsFor(section, catKey);
  const answers = section === 'pre' ? state.data.preAnswers : state.data.postAnswers;
  const label = section === 'pre' ? 'Pre-test' : 'Post-test';
  const hubRoute = `${section}-hub`;
  const reviewRoute = `${section}-review-${catKey}`;

  // Kick off any explanations that haven't been fetched yet, before building
  // the HTML, so the first paint already shows "Thinking…" instead of an
  // idle button.
  questions.forEach(q=>{
    const qk = questionKey(section, q);
    const chosen = answers[qk];
    if (!chosen) return;
    const rec = state.data.explanations[qk];
    if (rec && (rec.status === 'loading' || rec.status === 'done')) return;
    state.data.explanations[qk] = { status:'loading', text:'' };
    fetchAIExplanation(q, chosen)
      .then(text => { state.data.explanations[qk] = { status:'done', text }; })
      .catch(err => { state.data.explanations[qk] = { status:'error', text: err.message || 'Something went wrong.' }; })
      .finally(()=>{ saveDraft(); if (state.route === reviewRoute) render(); });
  });

  app.innerHTML = `
    <div class="eyebrow">${label} — ${esc(cat.title)} · Review</div>
    <h1>Category complete: ${esc(cat.title)}</h1>
    <p class="lede">Here's why the strongest answer works best for each item.</p>
    <div class="card">
      ${questions.map((q,i)=>{
        const qk = questionKey(section, q);
        const chosen = answers[qk];
        return `
        <div class="q-block" ${i===0 ? 'style="padding-top:0;"' : ''}>
          <span class="q-code">${cat.code} · Question ${i+1} of ${questions.length}</span>
          <div class="q-scenario">${esc(q.scenario)}</div>
          <div class="q-prompt">${esc(q.question)}</div>
          <div class="review-answer">You chose <strong>${esc(chosen||'—')}. ${esc(q.options[chosen]||'')}</strong></div>
          ${renderAIBox(qk)}
        </div>`;
      }).join('')}
      <div class="btn-row end">
        <button class="btn" id="reviewDone">← Back to checklist</button>
      </div>
    </div>
  `;

  document.getElementById('reviewDone').onclick = ()=> go(hubRoute);

  document.querySelectorAll('.ai-retry-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const qk = btn.dataset.qk;
      const q = questions.find(qq => questionKey(section,qq) === qk);
      const chosen = answers[qk];
      state.data.explanations[qk] = { status:'loading', text:'' };
      render();
      fetchAIExplanation(q, chosen)
        .then(text => { state.data.explanations[qk] = { status:'done', text }; })
        .catch(err => { state.data.explanations[qk] = { status:'error', text: err.message || 'Something went wrong.' }; })
        .finally(()=>{ saveDraft(); render(); });
    });
  });
}

function scoreCategory(section, catKey){
  const questions = questionsFor(section, catKey);
  const answers = section === 'pre' ? state.data.preAnswers : state.data.postAnswers;
  let correct = 0;
  questions.forEach(q=>{
    const letter = answers[questionKey(section,q)];
    if (letter && letter === q.answer) correct++;
  });
  return { correct, count: questions.length, pct: Math.round((correct/questions.length)*100) };
}

function scorePhase(section){
  let correct = 0, count = 0;
  const byCategory = {};
  CATEGORIES.forEach(c=>{
    const s = scoreCategory(section, c.key);
    byCategory[c.key] = s;
    correct += s.correct;
    count += s.count;
  });
  return { correct, count, pct: Math.round((correct/count)*100), byCategory };
}

function renderResults(app){
  if (!phaseComplete('pre') || !phaseComplete('post')) return go('pre-hub');
  const pre = scorePhase('pre');

  `;

      postAnswers: state.data.postAnswers,
      preScore: pre.correct,
      preTotal: pre.count,
      prePct: pre.pct,
      postScore: post.correct,
      postTotal: post.count,
      postPct: post.pct,
      preByCategory: Object.fromEntries(CATEGORIES.map(c=>[c.key, pre.byCategory[c.key].correct])),
      postByCategory: Object.fromEntries(CATEGORIES.map(c=>[c.key, post.byCategory[c.key].correct])),
    };
    DB.add(entry).then(()=>{

const PRE_Q_ORDER = allQuestionsFor('pre');
const POST_Q_ORDER = allQuestionsFor('post');

function toCSV(rows){
  if (!rows.length) return '';
  const headers = ['name','age','sex','section',
    ...PRE_Q_ORDER.map((q,i)=>`pre_q${i+1}`),
    ...POST_Q_ORDER.map((q,i)=>`post_q${i+1}`),
    'pre_score','pre_total','post_score','post_total'];
  const lines = [headers.join(',')];
  rows.forEach(r=>{
    const row = [
      r.demo.name||'', r.demo.age||'', r.demo.sex||'', r.demo.section||'',
      ...PRE_Q_ORDER.map(q => (r.preAnswers && r.preAnswers[questionKey('pre',q)]) || ''),
      ...POST_Q_ORDER.map(q => (r.postAnswers && r.postAnswers[questionKey('post',q)]) || ''),
      r.preScore, r.preTotal, r.postScore, r.postTotal,
    ];
    lines.push(row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  return lines.join('\n');
}

  if (!state.adminAuthed && sessionStorage.getItem('admin_authed')!=='1'){
    return go('portal-9x7k2m');

  if (!state.adminView) state.adminView = 'active';
  app.innerHTML = `<div class="eyebrow">Admin Portal</div><h1 style="font-size:26px;">Loading responses…</h1>`;
  const fetcher = state.adminView === 'archived' ? DB.archived() : DB.all();
  fetcher.then(rows=>{
    if (state.route !== 'portal-9x7k2m-dash') return; // user navigated away while loading
    renderAdminDashWithRows(app, rows);
  }).catch(err=>{
    app.innerHTML = `<div class="eyebrow">Admin Portal</div><h1 style="font-size:26px;">Couldn't load responses</h1><p class="lede">${esc(err.message||String(err))}</p>`;
  });
}

function renderAdminDashWithRows(app, rows){
  const isArchived = state.adminView === 'archived';
  const actionLabel = isArchived ? 'Restore selected' : 'Archive selected';
  const actionClass = isArchived ? 'btn' : 'btn danger';

  app.innerHTML = `
    <div class="top-bar">
      <div>
        <div class="eyebrow">Admin Portal</div>
        <h1 style="font-size:26px;">${isArchived ? 'Archived responses' : 'Survey results'}</h1>
      </div>
      <span class="pill">${rows.length} response${rows.length===1?'':'s'}</span>
    </div>
    <div class="card">
      <div class="btn-row" style="margin-top:0; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; gap:10px;">
          <button class="btn ${isArchived ? '' : 'secondary'}" id="tabActive">Active</button>
          <button class="btn ${isArchived ? '' : 'secondary'}" id="tabArchived">Archived</button>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn secondary" id="csvBtn">Download CSV</button>
          <button class="btn secondary" id="logoutBtn">Log out</button>
        </div>
        <button class="${actionClass}" id="actionBtn" disabled>${actionLabel} (0)</button>
      </div>
      <p class="lede" style="max-width:none; margin-top:0;">${isArchived
        ? 'These responses were archived by an admin. Restoring moves them back into the main results list.'
        : "Archiving moves a response to a separate backup collection — it's never permanently deleted from here."}</p>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:28px;"><input type="checkbox" id="selectAll"></th>
            <th>ID</th><th>Age</th><th>Sex</th><th>Section</th><th>Pre score</th><th>Post score</th><th>Δ</th>${isArchived ? '<th>Archived at</th>' : ''}
          </tr></thead>
          <tbody>
            ${rows.map(r=>{
              const delta = r.postScore - r.preScore;
              return `
              <tr>
                <td><input type="checkbox" class="row-check" data-id="${r.id}"></td>
                <td>${r.id}</td>
                <td>${esc(r.demo.age)}</td>
                <td>${esc(r.demo.sex)}</td>
                <td>${esc(r.demo.section)}</td>
                <td>${r.preScore}/${r.preTotal} (${r.prePct}%)</td>
                <td>${r.postScore}/${r.postTotal} (${r.postPct}%)</td>
                <td>${delta>0?'+':''}${delta}</td>
                ${isArchived ? `<td>${esc((r.archivedAt||'').replace('T',' ').slice(0,19))}</td>` : ''}
              </tr>
            `;}).join('') || `<tr><td colspan="${isArchived ? 9 : 8}" style="color:var(--ink-soft);">${isArchived ? 'No archived responses.' : 'No responses yet.'}</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const actionBtn = document.getElementById('actionBtn');
  const selectAll = document.getElementById('selectAll');
  const rowChecks = ()=> Array.from(document.querySelectorAll('.row-check'));

  function updateActionBtn(){
    const n = rowChecks().filter(c=>c.checked).length;
    actionBtn.textContent = `${actionLabel} (${n})`;
    actionBtn.disabled = n === 0;
  }

  rowChecks().forEach(cb=>{ cb.onchange = updateActionBtn; });
  if (selectAll){
    selectAll.onchange = ()=>{
      rowChecks().forEach(cb=>{ cb.checked = selectAll.checked; });
      updateActionBtn();
    };
  }

  document.getElementById('tabActive').onclick = ()=>{
    if (state.adminView === 'active') return;
    state.adminView = 'active';
    render();
  };
  document.getElementById('tabArchived').onclick = ()=>{
    if (state.adminView === 'archived') return;
    state.adminView = 'archived';
    render();
  };

  document.getElementById('csvBtn').onclick = ()=>{
    const csv = toCSV(rows);
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = isArchived ? 'survey_responses_archived.csv' : 'survey_responses.csv';
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('logoutBtn').onclick = ()=>{
    sessionStorage.removeItem('admin_authed');
    state.adminAuthed = false;
    state.adminView = 'active';
    go('portal-9x7k2m');
  };
  actionBtn.onclick = ()=>{
    const ids = rowChecks().filter(c=>c.checked).map(c=>c.dataset.id);
    if (!ids.length) return;
    const label = ids.length === 1 ? 'this response' : `these ${ids.length} responses`;
    const confirmMsg = isArchived
      ? `Restore ${label} back into the main results list?`
      : `Move ${label} to the backup collection? They'll be removed from the main results list but not permanently deleted.`;
    if (!confirm(confirmMsg)) return;
    actionBtn.disabled = true;
    actionBtn.textContent = isArchived ? 'Restoring…' : 'Archiving…';
    const op = isArchived ? DB.restore(ids) : DB.archive(ids);
    op.then(render).catch(err=>{
      alert(`Failed to ${isArchived ? 'restore' : 'archive'}: ` + (err.message||err));
      updateActionBtn();
    });
  };
}

render();
</script>
</body>
</html>
